[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xtalflow"
version = "1.0.0"
description = "Crystal image review and experiment workflow"
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy==1.26.4",
    # Also runs the crystal classifier, through cv2.dnn: onnxruntime has no
    # wheel this beamline's CentOS 7 can install, and OpenCV was here anyway.
    "opencv-python-headless==4.10.0.84",
    # Not interchangeable with cv2 for the resize. The model was trained on
    # images Pillow resized, which antialiases where cv2 does not; measured
    # over 72 images the difference changes the label on two to six of them.
    "pillow==12.3.0",
    "PyQt5==5.15.11",
    "cryptography==45.0.5",
    "msgpack==1.1.1",
    "requests==2.32.4",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[project.scripts]
xtalflow-viewer = "xtalflow.viewer:main"
xtalflow-mxlive-read = "xtalflow.mxlive_read:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "requires_rmserver_fixture: requires local tests/fixtures/rmserver image data",
]

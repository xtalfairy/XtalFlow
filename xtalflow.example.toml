# Copy this file to /etc/xtalflow/xtalflow.toml on the operating server.
# Store only key paths here; never store private-key contents.

[mxlive]
base_url = "https://mxlive.postech.ac.kr"
beamline = "BL-5C"
ca_bundle = "/etc/pki/tls/certs/ca-bundle.crt"

# The table name is the local OS username. The values identify the MxLive
# account. Omit this table when all three usernames/IDs are identical.
[mxlive.accounts.local_user]
username = "mxlive_user"
account_id = "mxlive_account_id"
key_path = "/data/users/local_user/.config/mxdc/keys.dsa"

# Instruments that receive worksheets. Each entry reads one worksheet kind:
# "echo" (ECHO dispensing) or "shifter" (SHIFTER harvesting). Every worksheet a
# plan produces is delivered to all instruments of that kind. Omit this section
# to use the built-in ECHO 650, SHIFTER 1, and SHIFTER 2 folders below.
[[instruments]]
id = "echo650"
worksheet = "echo"
directory = "/smbmount/echo650"
label = "ECHO 650"

[[instruments]]
id = "shifter1"
worksheet = "shifter"
directory = "/smbmount/shifter1"
label = "SHIFTER 1"

[[instruments]]
id = "shifter2"
worksheet = "shifter"
directory = "/smbmount/shifter2"
label = "SHIFTER 2"

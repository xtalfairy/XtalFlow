# Copy this file beside the installed version, as xtalflow.toml:
#
#   /usr/local/fbdd_apps/XtalFlow/xtalflow.toml   <- this file
#   /usr/local/fbdd_apps/XtalFlow/0.9/            <- the installed source tree
#
# XtalFlow looks there by itself; --mxlive-config points it somewhere else.
# The file is optional: without it the instruments below and the local user
# name are used. Store only key paths here; never store private-key contents.

[mxlive]
base_url = "https://mxlive.postech.ac.kr"
beamline = "BL-5C"
ca_bundle = "/etc/pki/tls/certs/ca-bundle.crt"

# The table name is the local OS username. The values identify the MxLive
# account. Omit this table when all three usernames/IDs are identical.
[mxlive.accounts.local_user]
username = "mxlive_user"
account_id = "mxlive_account_id"
key_path = "/data/users/local_user/.config/mxdc/keys.dsa"

# Instruments that receive worksheets. Each entry reads one worksheet kind:
# "echo" (ECHO dispensing) or "shifter" (SHIFTER harvesting). Every worksheet a
# plan produces is delivered to all instruments of that kind.
#
# This section REPLACES the built-in set rather than adding to it, so it has
# to name every instrument, not only a new one. Naming one station here would
# leave the ECHO and the other stations out, and that failure is quiet: the
# lamps are green for what is listed, saving succeeds, and the worksheets for
# everything left out are simply never written. There must be an "echo" entry
# whose id is exactly "echo650", and every harvesting station's id has to
# contain "shifter" - the harvest reads its worksheets back by that.
#
# Omitting the whole section uses the built-in folders below, which are the
# same four.
[[instruments]]
id = "echo650"
worksheet = "echo"
directory = "/smbmount/echo650"
label = "ECHO 650"

[[instruments]]
id = "shifter0"
worksheet = "shifter"
directory = "/smbmount/shifter0"
label = "SHIFTER 0"

[[instruments]]
id = "shifter1"
worksheet = "shifter"
directory = "/smbmount/shifter1"
label = "SHIFTER 1"

[[instruments]]
id = "shifter2"
worksheet = "shifter"
directory = "/smbmount/shifter2"
label = "SHIFTER 2"
